<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#086fb8" />
    <title>TEB Ask — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Inter, system-ui, sans-serif;
        background: #f4f7fb;
        color: #0f172a;
      }
      main {
        max-width: 20rem;
        padding: 1.5rem;
        text-align: center;
      }
      h1 {
        font-size: 1.125rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 1rem;
        color: #64748b;
        font-size: 0.875rem;
        line-height: 1.5;
      }
      button {
        border: 0;
        border-radius: 0.375rem;
        background: #086fb8;
        color: #fff;
        padding: 0.5rem 1rem;
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>TEB Ask needs a network connection to sign in and query live data. Reconnect, then try again.</p>
      <button type="button" onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
